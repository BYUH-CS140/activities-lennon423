<body class="started-page">
  <header>
    <div class="navbar">
      <a href="index.html" class="navbar-brand">
        <img src="images/jleo.png" alt="NYC Logo" class="logo-icon" />
      </a>
      <ul class="links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <a href="started.html" class="action_btn">Get Started</a>
      <div class="toggle_btn">
        <i class="fa-solid fa-bars"></i>
      </div>

    <ul class="dropdown_menu">
      <li><a href="index.html">Home</a></li>

      <li><a href="contact.html">Contact Us</a></li>

  <main>
    <section id="hero">
      <h1>Make Appointment With Us</h1>
      <div>
        <a href="started.html" class="action_btn2">Book Now</a>
        <div class="toggle_btn">
          <i class="fa-solid"></i>
        </div>
      </div>
    </section>
  </main>

  <script>
    const toggleBtn = document.querySelector('.toggle_btn');
    const toggleBtnIcon = document.querySelector('.toggle_btn i');
    const dropDownMenu = document.querySelector('.dropdown_menu');

    toggleBtn.addEventListener('click', function () {
      dropDownMenu.classList.toggle('open');
      const isOpen = dropDownMenu.classList.contains('open');

      toggleBtnIcon.className = isOpen
        ? 'fa-solid fa-xmark'
        : 'fa-solid fa-bars';
    });
  </script>
